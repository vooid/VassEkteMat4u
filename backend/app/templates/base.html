<!doctype html>
<html lang="{{ g.html_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t("site_title") }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('menu.index') }}">Ekte Mat</a>
    <nav class="header-nav">{% block header_nav %}{% endblock %}</nav>
    {% set other = "en" if current_language() == "no" else "no" %}
    <form class="lang-switch" method="post" action="{{ url_for('menu.set_language', lang=other) }}">
      <input type="hidden" name="next" value="{{ request.full_path if request.query_string else request.path }}">
      <button type="submit" aria-label="{{ t('language') }}: {{ t('other_language') }}"
              lang="{{ 'en' if other == 'en' else 'nb' }}">{{ t("other_language") }}</button>
    </form>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
