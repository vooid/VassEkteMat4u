{% extends "base.html" %}
{% block title %}{{ t("log_in") }} – Ekte Mat{% endblock %}
{% block content %}
<div class="form-page">
  <h1>{{ t("log_in") }}</h1>
  {% if failed %}
  <p class="flash flash-error" role="alert">{{ t("login_failed") }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('account.login', next=next or None) }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">{{ t("email") }}</label>
    <input id="email" name="email" type="email" autocomplete="email" required value="{{ email }}">
    <label for="password">{{ t("password") }}</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">{{ t("log_in") }}</button>
  </form>
  <p>{{ t("no_account") }} <a href="{{ url_for('account.register', next=next or None) }}">{{ t("register") }}</a></p>
  <p class="hint">{{ t("forgot_password_hint") }}</p>
</div>
{% endblock %}
