{% extends "base.html" %}
{% block title %}{{ t("staff_login") }} – Ekte Mat{% endblock %}
{% block content %}
<div class="form-page">
  <h1>{{ t("staff_login") }}</h1>
  {% if failed %}<p class="flash flash-error" role="alert">{{ t("login_failed") }}</p>{% endif %}
  <form method="post" action="{{ url_for('account.staff_login', next=next or None) }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">{{ t("email") }}</label>
    <input id="email" name="email" type="email" autocomplete="username" required value="{{ email }}">
    <label for="password">{{ t("password") }}</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">{{ t("log_in") }}</button>
  </form>
  <p class="hint">{{ t("staff_login_hint") }}</p>
  <p><a href="{{ url_for('account.pin_login', next=next or None) }}">{{ t("pin_login_link") }}</a></p>
</div>
{% endblock %}
